name: check

# THE DEV TEAM'S CI. The sync copies this file to .github/workflows/check.yml in their
# repository; it does not run here, which is why it lives outside the workflows folder.
#
# IT IS NOT A FILTERED COPY OF OURS AND IT SHOULD NOT BE. Our workflow skips the flow journeys
# because a free account's minutes ran out and a pre-push hook had already run them; and it ends
# by feeding this repository, which is not a thing this repository does. Neither applies here.
# So this runs the whole command, which is the honest default for somebody who has just been
# handed a build and wants to know whether it stands up.
#
# There is nothing to keep in step between the two. If a group is added, it is added to
# scripts/check-run.mjs, and both workflows pick it up without being edited.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
